<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Magnus</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Connect -->
  <section id="connect" class="connect" hidden>
    <div class="connect-inner">
      <div class="mark" aria-hidden="true"></div>
      <h1 class="display">Magnus</h1>
      <p class="muted">Your health coach. Paste your app token to connect this device.</p>
      <form id="connect-form" class="stack">
        <input id="token" class="field" type="password" autocomplete="off" placeholder="App token" required>
        <button class="btn primary" type="submit">Connect</button>
      </form>
    </div>
  </section>

  <div id="shell" hidden>
    <!-- Coach (home) -->
    <main id="view-coach" class="view coach" aria-label="Coach">
      <header class="coach-head">
        <div>
          <p class="eyebrow" id="coach-date"></p>
          <h1 class="display" id="greeting">Hello</h1>
        </div>
        <button class="pill-stat" id="coach-stat" type="button" aria-label="Open tracker">
          <span class="pill-ring"><svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15"/><circle class="fill" id="pill-ring" cx="18" cy="18" r="15"/></svg></span>
          <span><strong id="pill-days">–</strong><small>of 7 on track</small></span>
        </button>
      </header>

      <div id="thread" class="thread" aria-live="polite"></div>

      <div class="composer-wrap">
        <div class="chips" id="chips"></div>
        <form id="composer" class="composer">
          <button class="icon-btn" id="quick" type="button" aria-label="Quick add">+</button>
          <textarea id="input" rows="1" placeholder="Log a meal, steps, weight… or ask" autocomplete="off"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
          </button>
        </form>
      </div>
    </main>

    <!-- Tracker -->
    <main id="view-tracker" class="view tracker" aria-label="Tracker" hidden>
      <header class="tracker-head">
        <div>
          <p class="eyebrow" id="tracker-date"></p>
          <h1 class="display">Tracker</h1>
        </div>
        <button class="icon-btn ghost" id="settings-btn" type="button" aria-label="Goal and targets">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
        </button>
      </header>

      <section class="hero card">
        <div class="hero-ring">
          <svg viewBox="0 0 200 200" id="week-ring" aria-hidden="true"></svg>
          <div class="hero-center">
            <span class="hero-num" id="ns-num">–</span>
            <span class="hero-of" id="ns-of">of 7 days</span>
          </div>
        </div>
        <div class="hero-copy">
          <p class="eyebrow">North star · on-track days</p>
          <p class="hero-line" id="ns-line"></p>
          <div class="week-labels" id="week-labels"></div>
        </div>
      </section>

      <div class="due" id="checkin-due" hidden>
        <span>Weekly weigh-in is due.</span>
        <button class="link" data-sheet="checkin" type="button">Log it</button>
      </div>

      <section class="card" id="goal-card">
        <div class="card-head">
          <h2>Goal</h2>
          <span class="meta" id="goal-meta"></span>
        </div>
        <div id="goal-body"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Today</h2>
          <span class="score" id="today-score">–</span>
        </div>
        <ul class="checks" id="checks"></ul>
        <div class="quick-row">
          <button class="quick" data-sheet="meal" type="button"><span>Meal</span></button>
          <button class="quick" data-sheet="steps" type="button"><span>Steps</span></button>
          <button class="quick" data-sheet="checkin" type="button"><span>Weigh-in</span></button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Meals today</h2>
          <span class="meta" id="meals-meta"></span>
        </div>
        <ul class="list" id="meals"></ul>
      </section>

      <section class="card">
        <div class="card-head"><h2>Workouts</h2><span class="meta" id="workouts-meta">Hevy</span></div>
        <ul class="list" id="workouts"></ul>
      </section>

      <section class="card">
        <div class="card-head"><h2>Lifts</h2><span class="meta" id="lifts-meta"></span></div>
        <ul class="list" id="lifts"></ul>
        <button class="btn block ask" id="lifts-ask" type="button" hidden>Ask the coach what to change</button>
      </section>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <button class="tab active" data-view="coach" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Coach</span>
      </button>
      <button class="tab" data-view="tracker" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg><span>Tracker</span>
      </button>
    </nav>
  </div>

  <!-- Bottom sheet -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn ghost" id="sheet-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
