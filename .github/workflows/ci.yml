name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values so Vitest can import src/tools/clients.ts without a real .env
      SUPABASE_URL: https://ci-test.supabase.co
      SUPABASE_ANON_KEY: ci-test-anon-key
      ANTHROPIC_API_KEY: ci-test-anthropic-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Supply chain (OWASP LLM03): fail on a known high or critical hole in what ships to Railway.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax-check the PWA (plain JS, no build step)
        run: for f in pwa/*.js; do node --check "$f"; done
      - run: npm run build
      - run: npm test
