name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values so Vitest can import src/tools/clients.ts without a real .env
      SUPABASE_URL: https://ci-test.supabase.co
      SUPABASE_ANON_KEY: ci-test-anon-key
      ANTHROPIC_API_KEY: ci-test-anthropic-key
      UPSTASH_REDIS_REST_URL: https://ci-test.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-test-redis-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
