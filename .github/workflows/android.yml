name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to refresh the android-latest release on main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        run: gradle -p android assembleDebug

      # Signed release build, only when the signing secrets are set in the repo.
      - name: Build signed release
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.MAGNUS_KEYSTORE_B64 }}
          MAGNUS_KEYSTORE_PASSWORD: ${{ secrets.MAGNUS_KEYSTORE_PASSWORD }}
          MAGNUS_KEY_ALIAS: ${{ secrets.MAGNUS_KEY_ALIAS }}
          MAGNUS_KEY_PASSWORD: ${{ secrets.MAGNUS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/magnus.jks"
          MAGNUS_KEYSTORE_PATH="$RUNNER_TEMP/magnus.jks" gradle -p android assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: magnus-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      # The PWA's "Download the Android app" button points here, so a phone needs no GitHub login.
      - name: Publish to the android-latest release
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/magnus.apk"
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --target "$GITHUB_SHA" --title "Magnus for Android (latest)" --prerelease \
              --notes "Built from main by the Android app workflow. Install magnus.apk on your phone; each new build installs over the last one."
          fi
          gh release upload android-latest "$RUNNER_TEMP/magnus.apk" --clobber
          gh release edit android-latest --notes "Built from main at $GITHUB_SHA. Install magnus.apk on your phone; each new build installs over the last one."
