name: Android native (Magnus Beta)

on:
  push:
    branches: [main]
    paths: ["android-native/**", ".github/workflows/android-native.yml"]
  pull_request:
    paths: ["android-native/**", ".github/workflows/android-native.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to refresh the android-beta release on main
    env:
      KEYSTORE_B64: ${{ secrets.MAGNUS_KEYSTORE_B64 }}
      # Every build installs over the last one.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK and run unit tests
        run: gradle -p android-native assembleDebug testDebugUnitTest -PmagnusVersionCode=$VERSION_CODE

      # Signed with the same release key as the TWA app, so the final swap installs as an update.
      - name: Build signed release
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          MAGNUS_KEYSTORE_PASSWORD: ${{ secrets.MAGNUS_KEYSTORE_PASSWORD }}
          MAGNUS_KEY_ALIAS: ${{ secrets.MAGNUS_KEY_ALIAS }}
          MAGNUS_KEY_PASSWORD: ${{ secrets.MAGNUS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/magnus.jks"
          MAGNUS_KEYSTORE_PATH="$RUNNER_TEMP/magnus.jks" gradle -p android-native assembleRelease -PmagnusVersionCode=$VERSION_CODE

      - uses: actions/upload-artifact@v4
        with:
          name: magnus-beta
          path: android-native/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Only the release-signed build is published (the debug key is public).
      - name: Publish to the android-beta release
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::MAGNUS_KEYSTORE_* secrets are not set; android-beta was not updated."
            exit 0
          fi
          cp android-native/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/magnus-beta.apk"
          if ! gh release view android-beta >/dev/null 2>&1; then
            gh release create android-beta --target "$GITHUB_SHA" --title "Magnus Beta (native app)" --prerelease \
              --notes "The native Magnus app, in testing. Installs next to the main Magnus app."
          fi
          gh release upload android-beta "$RUNNER_TEMP/magnus-beta.apk" --clobber
          gh release edit android-beta --notes "Built from main at $GITHUB_SHA (build $VERSION_CODE). Installs next to the main Magnus app; each new build installs over the last one."
